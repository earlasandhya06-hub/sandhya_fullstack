<!DOCTYPE html>
<html>
<head>
    <title>Click Event Handlers Example</title>

    <script type="text/javascript">
        function Handler()
        {
            alert("Mouse Hover");
        }
    </script>
</head>

<body>

    <p onmouseover="Handler();">
        Move the mouse here...
    </p>

</body>
</html>
