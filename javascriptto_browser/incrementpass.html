<!DOCTYPE html>
<html>
<body>

<h1>JavaScript</h1>

<p id="demo"></p>

<script>
    var x = 4;
    x += 5;

    if (x < 10)
    {
        document.getElementById("demo").innerHTML = "Condition Passed";
    }
    else
    {
        document.getElementById("demo").innerHTML = "Condition Failed";
    }
</script>

</body>
</html>
